seed: 42

simulator:
  num_routes: 4
  history_len: 64
  merchant_segments: ["micro", "smb", "enterprise"]
  issuers: ["HDFC", "ICICI", "SBI", "AXIS", "KOTAK"]
  device_classes: ["android", "ios", "web_desktop", "web_mobile"]
  time_buckets: 24
  geo_buckets: 6
  behavior_policy:
    exploration_rate: 0.20

model:
  size: base
  d_model: 192
  n_heads: 6
  n_layers: 6
  ffn_mult: 4
  dropout: 0.1
  history_len: 64

pretrain:
  mask_field_prob: 0.15
  mask_event_prob: 0.10
  batch_size: 128
  lr: 2.0e-4
  epochs: 5
  weight_decay: 0.01
  next_event_loss_weight: 0.2

data:
  n_transactions: 100000
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
